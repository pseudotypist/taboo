# Publishes the game (web/) and the surprise page (yuyue/) to GitHub Pages on every push to main.
# The site root only forwards to web/, so https://pseudotypist.github.io/tabu-yuyue/ opens the game.
name: Publish the game to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Assemble the site
        run: |
          mkdir _site
          cp -R web yuyue _site/
          printf '<!doctype html><meta charset="utf-8"><title>Tabu</title><meta http-equiv="refresh" content="0; url=web/"><a href="web/">Tabu</a>\n' > _site/index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
