<svg xmlns="http://www.w3.org/2000/svg" viewBox="150 150 724 724" width="1024" height="1024">
  <!-- Tabu card mark, after the logo on the game's home screen: paper card with ink header,
       yellow/ink hazard tape and red taboo lines, yellow card behind. Transparent background.
       scripts/make-resources.mjs swaps OUTLINE for paper on dark backgrounds. -->
