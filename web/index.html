<!doctype html>

<head>
<meta charset="utf-8">

<title>Tabu</title>

<meta name="apple-mobile-web-app-title" content="Tabu">
<script>
/* Apply the saved Auto / Light / Dark choice before the first paint (same key as app.js: store 'theme'). */
(function () {
  var pref = 'auto';
  try { pref = JSON.parse(localStorage.getItem('tabu1.theme')) || 'auto'; } catch (e) {}
  var DARK_THEME_ENABLED = false; // off for now; must match the same switch in app.js
  var dark = DARK_THEME_ENABLED && (pref === 'dark' || (pref !== 'light' && !!(window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches)));
  document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
  if (dark) document.querySelector('meta[name="theme-color"]').setAttribute('content', '#0c0e0b');
})();
</script>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">

</head>

</body>
</html>
